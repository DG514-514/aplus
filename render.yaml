# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates the website with a persistent disk so client accounts and orders survive restarts.
services:
  - type: web
    name: aplus-cleaning-solutions
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /var/data/aplus.db
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: aplus-data
      mountPath: /var/data
      sizeGB: 1
